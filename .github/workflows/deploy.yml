name: Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deploy Command via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # ۱. اجرای دیپلوی پایه توسط dploy
            /usr/local/bin/dploy deploy main
            
            # ۲. رفتن به پوشه ریلیز جدید
            cd /home/devprofile-the25years/htdocs/the25years.devprofile.ir/current
            
            # ۳. اتصال اجباری فایل .env
            ln -sf ../../shared/.env .env
            
            # ۴. نصب پکیج‌های جاوااسکریپت و بیلد کردن فایل‌های Vite
            npm install
            npm run build
            
            # ۵. پاک کردن و ساخت مجدد کش لاراول
            php8.2 artisan optimize:clear
            php8.2 artisan config:cache