name: Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deploy Command via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # ۱. اجرای دیپلوی پایه بدون دستور بهینه‌سازی داخلی
            /usr/local/bin/dploy deploy main
            
            # ۲. رفتن به پوشه ریلیز جدید که سوئیچ شده است
            cd /home/devprofile-the25years/htdocs/the25years.devprofile.ir/current
            
            # ۳. اتصال اجباری فایل .env واقعی
            ln -sf ../../shared/.env .env
            
            # ۴. حالا که فایل تنظیمات هست، کش را با خیال راحت می‌سازیم
            php8.2 artisan optimize:clear
            php8.2 artisan optimize