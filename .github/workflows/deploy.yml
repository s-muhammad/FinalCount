name: Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deploy Command via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # ۱. اجرای دیپلوی بدون مشکل
            /usr/local/bin/dploy deploy main
            
            # ۲. ورود به ریلیز جدید و پاک کردن کش برای اعمال نهایی
            cd /home/devprofile-the25years/htdocs/the25years.devprofile.ir/current
            php8.2 artisan optimize:clear
            php8.2 artisan optimize